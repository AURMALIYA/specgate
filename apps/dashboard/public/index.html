<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpecGate Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>SpecGate</h1>
      <span class="sub">spec-driven development governance</span>
      <button id="refresh">Refresh</button>
    </header>

    <main>
      <section id="metrics">
        <h2>Observability</h2>
        <div class="cards" id="metric-cards"></div>
      </section>

      <section id="tiers">
        <h2>Risk-tier distribution</h2>
        <div class="bars" id="tier-bars"></div>
      </section>

      <section id="conflicts">
        <h2>Open conflicts</h2>
        <div id="conflict-list"></div>
      </section>

      <section id="registry">
        <h2>Registry</h2>
        <table id="registry-table">
          <thead>
            <tr><th>Spec</th><th>Title</th><th>Tier</th><th>Provides</th><th>Categories</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
