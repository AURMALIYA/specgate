name: spec-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Unit tests (engines, neutrality, fixtures)
        run: pnpm test

      - name: Gate platform's own specs (default config)
        run: node packages/cli/dist/bin.js gate specs --config config/default.config.yaml

      - name: Gate example-org specs
        run: node packages/cli/dist/bin.js gate config/example-org/specs --config config/example-org/config.yaml

      - name: Demonstrate conflict detection blocks (expected to fail)
        run: |
          if node packages/cli/dist/bin.js gate config/example-org/specs-conflict \
              --config config/example-org/config.yaml; then
            echo "::error::Expected conflict/hidden-RED fixtures to block, but the gate passed." && exit 1
          else
            echo "Conflict + hidden-RED fixtures correctly blocked."
          fi

      - name: Spec Kit — emit preset and verify the template passes the gate
        run: |
          node packages/speckit-adapter/dist/bin.js emit-preset /tmp/specgate-preset --config config/default.config.yaml
          node packages/cli/dist/bin.js validate /tmp/specgate-preset/templates/spec-template.md --config config/default.config.yaml

      - name: Spec Kit — gate a Spec Kit feature directory
        run: node packages/speckit-adapter/dist/bin.js gate config/example-org/speckit-example/specs/001-promo-badge --config config/example-org/config.yaml

  # Example: gate a PR in REPO mode — evaluate the changed specs against EVERY
  # spec in the repo and post a sticky "what to fix/improve" comment. Make this
  # job a REQUIRED status check in branch protection so a failing gate blocks merge.
  pr-gate-repo-mode:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write   # to post the sticky review comment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # need the base branch to diff changed specs
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: Compute changed spec files
        id: changed
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD -- 'specs/**/*.md' | tr '\n' ' ')
          echo "files=$changed" >> "$GITHUB_OUTPUT"
      - uses: ./apps/action
        with:
          mode: repo
          config: config/default.config.yaml
          specs: specs
          changed: ${{ steps.changed.outputs.files }}
          pr_number: ${{ github.event.pull_request.number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
